
<!-- Concepts: images, src, alt, width, height, image links. -->
 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
</head>
<body>

    <h1>Programming Languages Image Gallery</h1>

    <h2>HTML</h2>
    <a href="images/html.jpg">
        <img src="images/html.jpg"
             alt="HTML logo representing webpage structure"
             width="200"
             height="150">
    </a>

    <h2>CSS</h2>
    <img src="images/css.jpg"
         alt="CSS logo representing webpage styling"
         width="200"
         height="150">

    <h2>JavaScript</h2>
    <img src="images/javascript.jpg"
         alt="JavaScript logo used for interactive websites"
         width="200"
         height="150">

    <h2>Java</h2>
    <img src="images/java.jpg"
         alt="Java programming language logo"
         width="200"
         height="150">

</body>
</html>
