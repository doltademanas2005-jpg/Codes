
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Additional Examples</title>
</head>
<body>

    <h3>Additional Examples</h3>

    <!-- Search Available Jobs -->
    <fieldset>
        <legend>Search Available Jobs</legend>

        <label for="jobTitle">Job Title:</label>
        <input type="search" id="jobTitle" name="jobTitle">

        <button type="button"
                onclick="alert('Searching jobs...')">
            Search Jobs
        </button>
    </fieldset>

    <br>

    <!-- Recently Submitted Details -->
    <fieldset>
        <legend>Recently Submitted Details</legend>

        <label for="applicationId">Application ID:</label>
        <input type="text" id="applicationId"
               name="applicationId"
               value="JOB20261001" readonly>
        <br><br>

        <label>Company:</label>
        <span>Example Company</span>
        <br><br>

        <button type="button"
                onclick="alert('Update Profile clicked')">
            Update Profile
        </button>
    </fieldset>

    <br>

    <p>Join Our Job Application Portal</p>
</body>
</html>
