<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display: inline-block</title>
    <style>
        .div1{
            background-color: red;
            width: 200px;
            height: 200px;
            display: inline-block;
        }
        .div2{
            background-color: blue;
            width: 200px;
            height: 200px;
            display: inline-block;
        }

        
    </style>
</head>
<body>
    <div class="div1">
        Manas
    </div>
    <div class="div2">
        Doltade
    </div>
</body>
</html>
